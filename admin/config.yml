backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "sv"

collections:
  - name: "settings"
    label: "Inställningar"
    files:
      - name: "hero"
        label: "Hero / Startsida"
        file: "content/hero.json"
        fields:
          - { label: "Rubrik rad 1", name: "title_line1", widget: "string", default: "Blommor, grönsaker" }
          - { label: "Rubrik rad 2", name: "title_line2", widget: "string", default: "och hjärta — direkt" }
          - { label: "Rubrik rad 3", name: "title_line3", widget: "string", default: "från trädgården" }
          - { label: "Underrubrik", name: "subtitle", widget: "text" }
          - { label: "Badge-text", name: "badge", widget: "string", default: "🌿 Munkedal, Bohuslän" }
          - { label: "Hero-bakgrundsbild", name: "hero_image", widget: "image", required: false }

      - name: "about"
        label: "Om mig"
        file: "content/about.json"
        fields:
          - { label: "Porträttbild", name: "portrait", widget: "image" }
          - { label: "Rubrik", name: "title", widget: "string", default: "Hej, jag är Elisa" }
          - { label: "Text (stycke 1)", name: "text1", widget: "text" }
          - { label: "Text (stycke 2)", name: "text2", widget: "text" }
          - { label: "Text (stycke 3)", name: "text3", widget: "text" }
          - { label: "Text (stycke 4)", name: "text4", widget: "text" }
          - label: "Taggar"
            name: "tags"
            widget: "list"
            field: { label: "Tagg", name: "tag", widget: "string" }
          - label: "Tre rutor (bild + rubrik + text)"
            name: "cards"
            widget: "list"
            max: 3
            label_singular: "Ruta"
            hint: "De tre klickbara rutorna under Om mig. Redigera bild, rubrik och text."
            fields:
              - { label: "Bild", name: "image", widget: "image" }
              - { label: "Rubrik", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

      - name: "blommor"
        label: "Blommor"
        file: "content/blommor.json"
        fields:
          - { label: "Rubrik", name: "title", widget: "string", default: "Blommor" }
          - { label: "Beskrivning", name: "description", widget: "text" }
          - { label: "Bild 1", name: "image1", widget: "image" }
          - { label: "Bild 2", name: "image2", widget: "image" }
          - { label: "Visa självplock-banner", name: "show_sjalvplock", widget: "boolean", default: true }
          - { label: "Självplock — rubrik", name: "sjalvplock_title", widget: "string", default: "Nästa självplock" }
          - { label: "Självplock — text", name: "sjalvplock_text", widget: "string", default: "Datum meddelas snart — Följ mig på Instagram för att inte missa nästa tillfälle!" }
          - { label: "Självplock PAUSAT — rubrik", name: "sjalvplock_locked_title", widget: "string", default: "Självplock är pausat just nu", hint: "Visas när självplock är AVstängt ovan" }
          - { label: "Självplock PAUSAT — text", name: "sjalvplock_locked_text", widget: "text", default: "Just nu erbjuds inget självplock. Följ mig på Instagram och Facebook så får du veta när odlingen öppnar igen!", hint: "Visas när självplock är AVstängt ovan" }

      - name: "gronsaker"
        label: "Grönsaker"
        file: "content/gronsaker.json"
        fields:
          - { label: "Rubrik", name: "title", widget: "string", default: "Grönsaker" }
          - { label: "Beskrivning", name: "description", widget: "text" }
          - { label: "Bild 1", name: "image1", widget: "image" }
          - { label: "Bild 2", name: "image2", widget: "image" }
          - { label: "Visa beställningsformulär", name: "show_form", widget: "boolean", default: true }
          - { label: "Formulär — rubrik", name: "form_title", widget: "string", default: "Beställ grönsakslåda" }
          - { label: "Formulär — text", name: "form_text", widget: "string", default: "Jag återkommer med info om avhämtningstider och veckans innehåll." }
          - { label: "PAUSAT — rubrik", name: "locked_title", widget: "string", default: "Beställning pausad", hint: "Visas när beställningsformuläret är AVstängt ovan" }
          - { label: "PAUSAT — text", name: "locked_text", widget: "text", default: "Just nu finns inga grönsakslådor att beställa. Följ mig på Instagram för att få reda på när det öppnar igen!", hint: "Visas när beställningsformuläret är AVstängt ovan" }

      - name: "workshops"
        label: "Workshops"
        file: "content/workshops.json"
        fields:
          - { label: "Rubrik", name: "title", widget: "string", default: "Kommande workshops" }
          - { label: "Beskrivning", name: "description", widget: "text" }
          - { label: "Visa workshops (av = visar pausat-text)", name: "show_workshops", widget: "boolean", default: true, hint: "Stäng av när inga aktuella workshops finns — då visas pausat-texten istället för listan och anmälan." }
          - { label: "PAUSAT — rubrik", name: "locked_title", widget: "string", default: "Just nu finns inga aktuella workshops", hint: "Visas när workshops är AVstängt ovan" }
          - { label: "PAUSAT — text", name: "locked_text", widget: "text", default: "Anmäl dig till mejlutskicket eller håll koll på Instagram och Facebook så får du veta när nästa tillfälle släpps!", hint: "Visas när workshops är AVstängt ovan" }
          - { label: "Header-bild", name: "header_image", widget: "image", required: false }
          - label: "Workshop-bilder (visas i bredd, rekommenderat 3 st)"
            name: "images"
            widget: "list"
            label_singular: "Bild"
            hint: "Bilderna under workshop-listan. Byt ut eller lägg till — ladda upp i mappen images/."
            fields:
              - { label: "Bild", name: "src", widget: "image" }
              - { label: "Bildtext (tillgänglighet)", name: "alt", widget: "string", required: false }
          - label: "Workshops"
            name: "items"
            widget: "list"
            fields:
              - { label: "Namn", name: "name", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string", required: false }
              - { label: "Datum", name: "date", widget: "string" }
              - { label: "Plats", name: "location", widget: "string", default: "Munkedal" }
              - { label: "Längd", name: "duration", widget: "string", default: "Ca 2 timmar" }
              - { label: "Pris", name: "price", widget: "string" }
              - { label: "Pristext", name: "price_note", widget: "string", default: "per person" }
              - { label: "Extra info", name: "extra", widget: "string", required: false }
              - { label: "CTA-text", name: "cta", widget: "string", default: "Anmäl dig" }

      - name: "kontakt"
        label: "Kontakt"
        file: "content/kontakt.json"
        fields:
          - { label: "Plats", name: "location", widget: "string", default: "Munkedal, Bohuslän" }
          - { label: "Instagram", name: "instagram", widget: "string", default: "@tradgardsfloristen" }
          - { label: "Instagram-URL", name: "instagram_url", widget: "string", default: "https://www.instagram.com/tradgardsfloristen" }
          - { label: "Facebook-text", name: "facebook", widget: "string", default: "Trädgårdsfloristen" }
          - { label: "Facebook-URL", name: "facebook_url", widget: "string", default: "https://www.facebook.com/tradgardsfloristen" }

      - name: "instagram"
        label: "Instagram — Planera inlägg"
        file: "content/instagram.json"
        fields:
          - label: "Instagram-poster"
            name: "posts"
            widget: "list"
            label_singular: "Inlägg"
            fields:
              - { label: "Bildtext / Caption", name: "caption", widget: "text" }
              - label: "Hashtags (max 5 per inlägg)"
                name: "hashtags"
                widget: "list"
                max: 5
                label_singular: "Hashtag"
                field: { label: "Hashtag", name: "tag", widget: "string", hint: "Skriv utan #, t.ex. trädgård" }
              - { label: "Datum", name: "date", widget: "date", required: false, hint: "När är inlägget planerat?" }
              - { label: "Status", name: "status", widget: "select", options: ["Utkast", "Redo att publicera", "Publicerat"], default: "Utkast" }

  - name: "collage"
    label: "🖼 Workshop-kollage"
    files:
      - name: "collage"
        label: "Kollage — bilder intill anmälningsformuläret"
        file: "content/collage.json"
        fields:
          - label: "Bilder (max 8 — visas i mosaic-layout)"
            name: "images"
            widget: "list"
            max: 8
            label_singular: "Bild"
            hint: "Byt ut bilder här — första bilden visas dubbelt bred. Ladda upp nya bilder i mappen images/."
            fields:
              - { label: "Bild", name: "src", widget: "image", hint: "Välj eller ladda upp en bild" }
              - { label: "Bildtext (för tillgänglighet)", name: "alt", widget: "string", hint: "Beskriv bilden kort" }

  - name: "nyhetsbrev"
    label: "📬 Nyhetsbrev"
    folder: "content/nyhetsbrev"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "subject"
    summary: "{{subject}} — {{date}}"
    fields:
      - { label: "Ämnesrad", name: "subject", widget: "string", hint: "Denna text syns i mottagarens inkorg" }
      - { label: "Datum", name: "date", widget: "date" }
      - { label: "Hälsning", name: "greeting", widget: "string", default: "Hej!", hint: "T.ex. Hej! eller Hej kära prenumerant!" }
      - { label: "Inledningstext", name: "intro", widget: "text", hint: "Kort intro — vad handlar det här utskicket om?" }
      - label: "Sektioner"
        name: "sections"
        widget: "list"
        label_singular: "Sektion"
        hint: "Lägg till så många sektioner du vill — t.ex. Workshop-info, Blomnyhet, Recept"
        fields:
          - { label: "Rubrik", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "text" }
          - { label: "Bild", name: "image", widget: "image", required: false }
          - { label: "Knapp-text", name: "cta_text", widget: "string", required: false, hint: "T.ex. Läs mer eller Anmäl dig" }
          - { label: "Knapp-länk", name: "cta_url", widget: "string", required: false, hint: "URL dit knappen ska leda" }
      - { label: "Avslutning", name: "outro", widget: "string", default: "Varmt tack för din prenumeration! // Elisa 🌿" }
