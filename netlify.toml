[build]
  publish = "."
  command = "echo 'No build needed'"

[functions]
  directory = "netlify/functions"

# Privat släktträdsapp. Netlify behåller den publika adressen under
# tradgardsfloristen.se/alfredsson och proxar till den dynamiska Railway-tjänsten.
[[redirects]]
  from = "/alfredsson"
  to = "https://web-production-fd306.up.railway.app/alfredsson"
  status = 200
  force = true

[[redirects]]
  from = "/alfredsson/*"
  to = "https://web-production-fd306.up.railway.app/alfredsson/:splat"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# Signed opt-out links use this function endpoint.
[[redirects]]
  from = "/avsluta"
  to = "/.netlify/functions/unsubscribe"
  status = 200

# Resend's one-click List-Unsubscribe request uses POST.
[[redirects]]
  from = "/avsluta-one-click"
  to = "/.netlify/functions/unsubscribe"
  status = 200
